      # MAX_POSITION_PCT/MAX_POSITION_DOLLARS caps bound the upside. Live kody, paper shadows on the rest.
      - ENABLE_CONF_LINEAR_SIZING=true
      - CONF_LINEAR_BUDGET_MIN=0.4
      - CONF_LINEAR_BUDGET_MAX=1.8
      - FLEET_RANK=4
      - POLYGON_API_KEY=${VINNY_POLYGON_API_KEY}
      - ENABLE_POLYGON_WS=false
      - WEBULL_APP_KEY=${VINNY_WEBULL_APP_KEY}
      - WEBULL_APP_SECRET=${VINNY_WEBULL_APP_SECRET}
      - PAPER_TRADE=true
      - WEBULL_KILL_SWITCH=true
      - EXIT_ENGINE=v5
      # Account-type toggle. false = Individual CASH (current; GFV-limited intraday reinvest).
      # true = Individual MARGIN: auto-detects the margin account (UNLESS WEBULL_ACCOUNT_ID is pinned —
      # kody is, so update its ID too) + skips GFV so sale proceeds reinvest intraday. Sizes off net-liq
      # (no extra leverage). PDT no longer a constraint. Flip per-bot when ready, then redeploy that bot.
      - MARGIN_ACCOUNT=false
      # Delta-sized budget (cheap-OTM-call tail brake, calls-only, ref 0.45) — pure risk-reduction, all bots.
      - ENABLE_DELTA_SIZED_BUDGET=true
      # FOMC-day pause: block all new entries on Fed announcement days (Trump-Fed panic days hurt both sides) — 2026-06-18.
      - ENABLE_FOMC_PAUSE=true
      - MAX_CONCURRENT=8
      - MAX_POSITION_PCT=15
      - MAX_DCA_POSITION_PCT=10
      - MAX_TRADE_LOSS_EXIT_PCT=8
      - MAX_PORTFOLIO_RISK_PCT=75
      - ENABLE_WEBULL_PAPER=true
      # Signal source: sourcing pipeline only (no Discord signals)
      - ENABLE_DISCORD_SIGNALS=false
      # V6 enhancements
      - ENABLE_V6_PER_TICKER_CONFIG=true
      # Same V7 strategy as kody/dennis (identical code+config; only PAPER_TRADE differs).
      - ENABLE_V7_WIDE_TRAIL=true
      - ML_PATTERN_THRESHOLD=0.62
      # UW whale-flow signals on all bots 2026-06-13 (live on kody/dennis, paper on adam/vinny/yank).
      - ENABLE_UW_FLOW_SIGNAL=true
      # Selective OTM flow strike (validated combos: AMD/INTC/META/SPY calls, TSLA puts) — 2026-06-15.
      - ENABLE_FLOW_OTM_STRIKE=true
      # Anti-martingale ADD: buy more on a confirmed runner (CALL +30 / PUT +30&+100 pyramid) — 2026-06-15.
      # Anti-martingale add OFF (2026-06-16): flat-+EV but it DILUTES book PF + raises drawdown →
      # hurts compounding ($18k/60d gold standard: $2.1M lock-only → $0.6M with adds). Separate-leg
      # + safety code stays in place, dormant. Re-enable only with a compounding-positive variant.
      - ENABLE_ANTIMARTINGALE_ADD=false
      - ANTIMG_CALL_LEVELS=30,80,150
      # CALL-only profit-lock (keep 60% of peak gain once +30%) — the runner-capture win, stays ON.
      - ENABLE_V7_PROFIT_LOCK=true
      # 0DTE premium hard-stop -25%: cut a 0DTE contract down 25% from entry regardless of underlying
      # (the NVDA -42% theta-melt fix) — PUT PF win + call tail insurance, 2026-06-16.
      - ENABLE_0DTE_PREMIUM_HARDSTOP=true
      - PREMIUM_HARDSTOP_0DTE_PCT=25
      # Take-profit: freeze sizing at $50k once reached, bank the excess (caps absolute drawdown) — 2026-06-16.
      - MAX_SIZING_BALANCE=50000
      # Fleet staggering K=2: each signal → 2 of 5 bots (priority round-robin) so they don't all crater
      # together (corr 0.95→0.22, fleet DD 5x smaller) — 2026-06-16. FLEET_RANK is per-bot (below).
      - ENABLE_FLEET_STAGGER=true
      - FLEET_SIZE=5
      - FLEET_OVERLAP=2
      # B2 market-tide gate: down-size puts entered against the market-wide whale tide (puts-only) — 2026-06-15.
      - ENABLE_V7_TIDE_GATE=true
      - ENABLE_V6_BREAKEVEN_RATCHET=true
      - ENABLE_V6_2PM_TIGHTEN=true
      - ENABLE_V6_PREMIUM_CAP=false
      - ENABLE_OTM_DISTANCE_GATE=false
      - ENABLE_DELTA_GATE=true
      - ENABLE_V6_SPREAD_GATE=true
      - ENABLE_V6_SCALEOUT=true
      - ENABLE_V6_DCA=true
      # Stage D conviction sizing — vinny FIRST (paper canary), validated +72%/PF1.64; then kody.
      - ENABLE_V7_CONVICTION_SIZING=true
      - ENABLE_V6_EARLY_POP_GATE=true
      - ENABLE_DIP_CONFIRM=true

      - AGENT_ID=owlet_vinny
      - ENABLE_POSTGRES=true
      - DATABASE_URL=postgresql://owl:${POSTGRES_PASSWORD:-owl_dev_2026}@postgres:5432/options_owl
      - ENABLE_REDIS=true
      - REDIS_URL=redis://redis:6379/0

    volumes:
      - ./journal/owlet-vinny:/app/journal
      - ./journal/models:/app/journal/models:ro

