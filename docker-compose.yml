    container_name: owlet-adam
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PORTFOLIO_SIZE=4685
      # runner_v1 P(runner) CALL sizing (paper canary): bet bigger on high-P(runner) rippers. Cuts = live
