# docker-compose.yml — run multiple OptionsOwl bots with shared config.
#
# Usage:
#   1. Edit .env with shared strategy/API config
#   2. Set PORTFOLIO_SIZE per bot below (only difference between owlets)
#   3. docker compose up -d
#
# Each bot gets:
#   - Shared .env config (mounted read-only)
#   - PORTFOLIO_SIZE override via environment
#   - Its own journal/ directory (SQLite DB, logs, heartbeat)

x-bot-common: &bot-common
  build: .
  restart: always
  stop_grace_period: 10s
  env_file: .env
  environment:
    - PYTHONUNBUFFERED=1
  healthcheck:
    test: ["CMD", "python", "-c", "import time; from pathlib import Path; hb=Path('journal/heartbeat'); assert hb.exists(), 'no heartbeat'; age=time.time()-int(hb.read_text()); assert age<120, f'stale heartbeat: {age:.0f}s'"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 45s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  deploy:
    resources:
      limits:
        memory: 1G

services:
  # ── Shared Redis (cross-agent coordination) ──
  redis:
    image: redis:7-alpine
    container_name: options-owl-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - ./journal/redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Shared PostgreSQL (sourcing + future bot migration) ──
  postgres:
    image: postgres:16-alpine
    container_name: options-owl-db
    restart: always
    environment:
      POSTGRES_DB: options_owl
      POSTGRES_USER: owl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owl_dev_2026}
    volumes:
      - ./journal/postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owl"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  owlet-kody:
    <<: *bot-common
    container_name: owlet-kody
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PORTFOLIO_SIZE=23000
      - FLEET_RANK=0
      - PAPER_TRADE=false
      - WEBULL_KILL_SWITCH=false
      - EXIT_ENGINE=v5
      # Account-type toggle. false = Individual CASH (current; GFV-limited intraday reinvest).
      # true = Individual MARGIN: auto-detects the margin account (UNLESS WEBULL_ACCOUNT_ID is pinned —
      # kody is, so update its ID too) + skips GFV so sale proceeds reinvest intraday. Sizes off net-liq
      # (no extra leverage). PDT no longer a constraint. Flip per-bot when ready, then redeploy that bot.
      - MARGIN_ACCOUNT=false
      # Delta-sized budget (cheap-OTM-call tail brake, calls-only, ref 0.45) — pure risk-reduction, all bots.
      - ENABLE_DELTA_SIZED_BUDGET=true
      # FOMC-day pause: block all new entries on Fed announcement days (Trump-Fed panic days hurt both sides) — 2026-06-18.
      - ENABLE_FOMC_PAUSE=true
      - MAX_CONCURRENT=8
      - MAX_POSITION_PCT=15
      - MAX_DCA_POSITION_PCT=10
      - MAX_TRADE_LOSS_EXIT_PCT=8
      - MAX_PORTFOLIO_RISK_PCT=75
      - ENABLE_WEBULL_PAPER=true
      - WEBULL_APP_KEY=${KODY_WEBULL_APP_KEY}
      - WEBULL_APP_SECRET=${KODY_WEBULL_APP_SECRET}
      - WEBULL_ACCOUNT_ID=${KODY_WEBULL_ACCOUNT_ID}
      - WEBULL_EMAIL=${KODY_WEBULL_EMAIL}
      - WEBULL_PASSWORD=${KODY_WEBULL_PASSWORD}
      - WEBULL_TRADE_PIN=${KODY_WEBULL_TRADE_PIN}
      - WEBULL_DID=${KODY_WEBULL_DID}
      # Signal source: sourcing pipeline only (no Discord signals)
      - ENABLE_DISCORD_SIGNALS=false
      # V6 enhancements
      - ENABLE_V6_PER_TICKER_CONFIG=true
      # V7 Phase A (CALL wide-trail exits) — kody only, staged rollout 2026-06-12.
      # Exit-only ablation: both OOS windows beat V6 exits at identical win rate
      # (OOS +72% / OOS2 +27% P&L, higher PF). PUTs unchanged.
      - ENABLE_V7_WIDE_TRAIL=true
      # V7 gate-volume fix (multi-value sweep 2026-06-13, 3 OOS windows): pattern 0.74→0.62
      # at entry 0.80. ~1.8× volume (1.7→3.1 trades/day), PF holds ~3.8, DD 6.5→10.
      - ML_PATTERN_THRESHOLD=0.62
      # UW whale-flow signals on all bots 2026-06-13 (live on kody/dennis, paper on adam/vinny/yank).
      - ENABLE_UW_FLOW_SIGNAL=true
      # Selective OTM flow strike (validated combos: AMD/INTC/META/SPY calls, TSLA puts) — 2026-06-15.
      - ENABLE_FLOW_OTM_STRIKE=true
      # Anti-martingale ADD: buy more on a confirmed runner (CALL +30 / PUT +30&+100 pyramid) — 2026-06-15.
      # Anti-martingale add OFF (2026-06-16): flat-+EV but it DILUTES book PF + raises drawdown →
      # hurts compounding ($18k/60d gold standard: $2.1M lock-only → $0.6M with adds). Separate-leg
      # + safety code stays in place, dormant. Re-enable only with a compounding-positive variant.
      - ENABLE_ANTIMARTINGALE_ADD=false
      - ANTIMG_CALL_LEVELS=30,80,150
      # CALL-only profit-lock (keep 60% of peak gain once +30%) — the runner-capture win, stays ON.
      - ENABLE_V7_PROFIT_LOCK=true
      # 0DTE premium hard-stop -25%: cut a 0DTE contract down 25% from entry regardless of underlying
      # (the NVDA -42% theta-melt fix) — PUT PF win + call tail insurance, 2026-06-16.
      - ENABLE_0DTE_PREMIUM_HARDSTOP=true
      - PREMIUM_HARDSTOP_0DTE_PCT=25
      # Take-profit: freeze sizing at $50k once reached, bank the excess (caps absolute drawdown) — 2026-06-16.
      - MAX_SIZING_BALANCE=50000
      # Fleet staggering K=2: each signal → 2 of 5 bots (priority round-robin) so they don't all crater
      # together (corr 0.95→0.22, fleet DD 5x smaller) — 2026-06-16. FLEET_RANK is per-bot (below).
      - ENABLE_FLEET_STAGGER=true
      - FLEET_SIZE=5
      - FLEET_OVERLAP=2
      # B2 market-tide gate: down-size puts entered against the market-wide whale tide (puts-only) — 2026-06-15.
      - ENABLE_V7_TIDE_GATE=true
      # Stage D conviction sizing — kody LIVE 2026-06-14 (validated +72% / combined PF 1.78; vinny paper canary).
      - ENABLE_V7_CONVICTION_SIZING=true
      # runner_v1 P(runner) call-sizing — CONSERVATIVE-LIVE 2026-06-22. Backtest-validated (~2x per-unit P&L,
      # monotonic P(runner)->outcome); serve path verified on adam/vinny canary (sane 0.60-0.73 scores). Softened
      # 0.7-1.3 mults (not the full 0.5-1.75 curve). Small paper bots couldn't test sizing (1 contract = no-op);
      # the edge only bites on multi-contract accounts (kody/dennis). 100% harvester-sourced (no per-bot Polygon).
      - ENABLE_RUNNER_V1_SIZING=true
      - RUNNER_V1_Q1=0.39
      - RUNNER_V1_Q2=0.69
      - RUNNER_V1_Q3=0.85
      - RUNNER_V1_MULT_Q1=0.7
      - RUNNER_V1_MULT_Q2=0.9
      - RUNNER_V1_MULT_Q3=1.1
      - RUNNER_V1_MULT_Q4=1.3
      # conf_linear (winner-concentration) sizing — AGGRESSIVE 0.4-1.8, 6mo-validated 2026-06-22:
      # +107% P&L vs flat at LOWER drawdown over 254 trades. Stacks w/ runner_v1 (×0.28–×2.34);
      # MAX_POSITION_PCT/MAX_POSITION_DOLLARS caps bound the upside. Live kody, paper shadows on the rest.
      - ENABLE_CONF_LINEAR_SIZING=true
      - CONF_LINEAR_BUDGET_MIN=0.4
      - CONF_LINEAR_BUDGET_MAX=1.8
      - ENABLE_V6_BREAKEVEN_RATCHET=true
      - ENABLE_V6_2PM_TIGHTEN=true
      - ENABLE_V6_PREMIUM_CAP=false
      - ENABLE_OTM_DISTANCE_GATE=false
      - ENABLE_DELTA_GATE=true
      - ENABLE_V6_SPREAD_GATE=true
      - ENABLE_V6_SCALEOUT=true
      - ENABLE_V6_DCA=true
      - ENABLE_V6_EARLY_POP_GATE=true
      - ENABLE_DIP_CONFIRM=true
      # Polygon WS disabled — Kody's key is used by harvester for centralized flow capture.
      # Premium monitoring uses Polygon REST (accurate, ~1s delay). All agents get
      # real-time flow data from harvester via Redis pub/sub.
      - ENABLE_POLYGON_WS=false
      - AGENT_ID=owlet_kody
      - ENABLE_POSTGRES=true
      - DATABASE_URL=postgresql://owl:${POSTGRES_PASSWORD:-owl_dev_2026}@postgres:5432/options_owl
      - ENABLE_REDIS=true
      - REDIS_URL=redis://redis:6379/0

    volumes:
      - ./journal/owlet-kody:/app/journal
      - ./journal/models:/app/journal/models:ro

