      # runner_v1 P(runner) call-sizing — fleet-uniform 2026-06-22 (matches kody validated config).
      - ENABLE_RUNNER_V1_SIZING=true
      - RUNNER_V1_Q1=0.39
      - RUNNER_V1_Q2=0.69
      - RUNNER_V1_Q3=0.85
